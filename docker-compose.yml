services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traficalm
      POSTGRES_USER: traficalm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traficalm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traficalm -d traficalm"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      laya:
        condition: service_started
    environment:
      TRAFICALM_DB_HOST: db
      TRAFICALM_DB_PASSWORD: ${POSTGRES_PASSWORD:-traficalm}
      # Optional: enables POST/DELETE /api/events
      TRAFICALM_ADMIN_TOKEN: ${TRAFICALM_ADMIN_TOKEN:-}
      TRAFICALM_LAYA_URL: ${TRAFICALM_LAYA_URL:-http://laya:8000}
      TRAFICALM_LAYA_API_KEY: ${LAYA_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Open-source Laya decision model (Apache-2.0, https://github.com/NandhaKishorM/laya).
  # Started by default; users can opt out of scoring in the planning form.
  laya:
    image: python:3.12-slim
    command: sh -c "pip install --no-cache-dir 'laya[serve]==0.4.34' && laya-serve"
    environment:
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      LAYA_MODELS: english
      LAYA_DEFAULT_MODEL: english
      LAYA_DEVICE: cpu
      LAYA_THREADS: "2"
    volumes:
      - laya-cache:/root/.cache

volumes:
  pgdata:
  laya-cache:
